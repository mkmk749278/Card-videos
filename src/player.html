<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Credit Card Awareness</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(../node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(../node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(../node_modules/@fontsource/poppins/files/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(../node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(../node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2)}
@font-face{font-family:NotoDeva;font-weight:500;src:url(../node_modules/@fontsource/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-500-normal.woff2)}
@font-face{font-family:NotoDeva;font-weight:700;src:url(../node_modules/@fontsource/noto-sans-devanagari/files/noto-sans-devanagari-devanagari-700-normal.woff2)}
@font-face{font-family:NotoTelugu;font-weight:500;src:url(../node_modules/@fontsource/noto-sans-telugu/files/noto-sans-telugu-telugu-500-normal.woff2)}
@font-face{font-family:NotoTelugu;font-weight:700;src:url(../node_modules/@fontsource/noto-sans-telugu/files/noto-sans-telugu-telugu-700-normal.woff2)}
:root{
  --bg0:#070b1a; --bg1:#0d1430; --ink:#f4f6ff; --mut:#9aa6c8; --line:rgba(255,255,255,.09);
  --teal:#2dd4bf; --cyan:#38bdf8; --violet:#8b5cf6; --amber:#f59e0b; --orange:#fb7185; --red:#f43f5e; --green:#22c55e;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:Poppins,NotoDeva,NotoTelugu,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 800px at 20% 10%,#16205a 0%,transparent 60%),radial-gradient(1000px 700px at 90% 90%,#2a1452 0%,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0))}
.blob{position:absolute;border-radius:50%;opacity:.32}
#grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:80px 80px;opacity:.35;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff}
#hud{position:absolute;left:64px;top:44px;display:flex;align-items:center;gap:16px;font-weight:600;font-size:22px;color:var(--mut);z-index:5}
#hud .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--violet));display:grid;place-items:center}
#hud .logo img{width:30px}
#hud .ch{color:var(--ink)}
#hud .sep{opacity:.4}
#lang{position:absolute;right:64px;top:50px;font-size:20px;font-weight:600;color:var(--mut);letter-spacing:2px;z-index:5}
#scene{position:absolute;left:0;top:0;width:1920px;height:1080px}
#cap{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);max-width:1560px;text-align:center;z-index:6}
#cap span{display:inline;background:rgba(5,8,22,.78);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:8px 22px;border-radius:14px;font-size:38px;line-height:1.75;font-weight:500}
body.hi #cap span{font-family:Poppins,NotoDeva}
body.te #cap span{font-family:Poppins,NotoTelugu}
#bar{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--teal),var(--violet));z-index:7}
.abs{position:absolute}
.h1{font-weight:800;font-size:64px;line-height:1.1;letter-spacing:-1px}
.h2{font-weight:700;font-size:48px;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:999px;font-weight:700;font-size:24px;letter-spacing:1px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.row{display:flex;align-items:center;gap:22px}
.item{display:flex;align-items:center;gap:22px;padding:20px 28px;border-radius:22px;background:var(--card);border:1px solid rgba(255,255,255,.1);font-size:32px;font-weight:500}
.item img{width:54px;height:54px;flex:none}
.grad{background:linear-gradient(90deg,#fff,#c7d2fe);-webkit-background-clip:text;color:transparent}
.gradw{background:linear-gradient(90deg,var(--amber),var(--red));-webkit-background-clip:text;color:transparent}
.num{font-weight:800;font-variant-numeric:tabular-nums}
.tick{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:28px}
.phone{width:470px;height:860px;border-radius:64px;background:#0b0f1d;border:10px solid #1c2440;box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 0 0 2px #2b3560;overflow:hidden}
.bubble{background:#1f2c34;border-radius:0 18px 18px 18px;padding:16px 20px;font-size:23px;line-height:1.35;color:#e9edef;margin:14px 18px 0 18px;max-width:390px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.stamp{border:10px solid var(--red);color:var(--red);font-weight:800;font-size:72px;padding:6px 30px;border-radius:18px;letter-spacing:4px;background:rgba(244,63,94,.08)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid"></div>
  <div id="fx"></div>
  <div id="scene"></div>
  <div id="hud"><div class="logo"></div><span>Credit Card Awareness</span><span class="sep">|</span><span class="ch"></span></div>
  <div id="lang"></div>
  <div id="cap"></div>
  <div id="bar"></div>
</div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const P = (t, a, d = 0.5) => clamp((t - a) / d);          // linear progress
const E = (t, a, d = 0.5) => easeOut(P(t, a, d));         // eased progress
const COLORS = {green:'#22c55e', amber:'#f59e0b', orange:'#fb923c', red:'#f43f5e', violet:'#8b5cf6', teal:'#2dd4bf', cyan:'#38bdf8'};
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');

let TL, ICONS, CHAPTERS = [];
const cache = {};

function icon(name, size = 64, extra = '') {
  const svg = ICONS[name] || ICONS['warning'];
  return `<img src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}" style="width:${size}px;height:${size}px;${extra}">`;
}
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

// ---- cue timing -----------------------------------------------------------
// item i appears when narration reaches sentence cue[i]; items sharing a
// sentence are spread across it. Without cues, spread evenly.
function cueTimes(sc, n, key = 'cue') {
  const S = sc.sentences, cue = sc[key];
  if (cue && S.length) {
    const groups = {};
    cue.forEach((c, i) => (groups[c] = groups[c] || []).push(i));
    const out = [];
    for (const c in groups) {
      const s = S[c], span = (s.end - s.start) * 0.8, g = groups[c];
      g.forEach((i, k) => out[i] = s.start + (g.length > 1 ? span * k / g.length : 0.1));
    }
    return out;
  }
  const a = 0.7, b = Math.max(a + 0.5, sc.dur * 0.72);
  return Array.from({length: n}, (_, i) => a + (b - a) * (n > 1 ? i / (n - 1) : 0));
}
function sentStart(sc, i) { return sc.sentences[Math.min(i, sc.sentences.length - 1)].start; }

// generic reveal: elements with data-at slide up + fade in
function reveal(root, lt) {
  root.querySelectorAll('[data-at]').forEach(e => {
    const at = +e.dataset.at, k = E(lt, at, 0.55);
    const kind = e.dataset.fx || 'up';
    let tr = '';
    if (kind === 'up') tr = `translateY(${(1 - k) * 40}px)`;
    else if (kind === 'left') tr = `translateX(${(1 - k) * -80}px)`;
    else if (kind === 'right') tr = `translateX(${(1 - k) * 80}px)`;
    else if (kind === 'pop') tr = `scale(${0.6 + 0.4 * easeBack(P(lt, at, 0.5))})`;
    e.style.opacity = k;
    e.style.transform = tr;
  });
}

// ---- scene builders -------------------------------------------------------
const B = {};

B.title = sc => {
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs" style="left:150px;top:250px;width:980px">
      <div class="pill" data-at="0.2" style="background:rgba(45,212,191,.15);color:var(--teal)">${sc.kicker.toUpperCase()}</div>
      <div class="h1" data-at="0.45" style="font-size:104px;margin-top:34px;line-height:1.02">Credit Card Bill<br><span class="gradw">Not Paid?</span></div>
      <div data-at="1.0" style="margin-top:36px;font-size:32px;color:var(--mut);line-height:1.5;max-width:900px">${sc.sub}</div>
    </div>
    <div class="abs cc" style="left:1180px;top:300px;width:600px;height:370px;border-radius:32px;background:linear-gradient(135deg,#312e81,#7c3aed 55%,#db2777);box-shadow:0 50px 120px rgba(124,58,237,.45);padding:40px;overflow:hidden">
      <div style="position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08)"></div>
      <div style="width:84px;height:64px;border-radius:12px;background:linear-gradient(135deg,#fde68a,#f59e0b);margin-top:40px"></div>
      <div style="font-size:40px;letter-spacing:6px;margin-top:40px;font-weight:600">•••• •••• •••• 4821</div>
      <div style="display:flex;justify-content:space-between;margin-top:26px;font-size:22px;opacity:.85"><span>CARD HOLDER</span><span>VALID 08/29</span></div>
      <div class="stampc abs stamp" style="left:150px;top:120px;font-size:60px">OVERDUE</div>
    </div>
    ${sc.icons.map((n, i) => `<div class="abs orb" data-i="${i}" style="left:${[1120, 1700, 1780, 1160][i]}px;top:${[190, 180, 700, 720][i]}px">${icon(n, 96)}</div>`).join('')}
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    const c = $('.cc', r), k = E(lt, 0.3, 0.9);
    c.style.transform = `perspective(1400px) rotateY(${-18 + 10 * Math.sin(lt * 0.6)}deg) rotateX(${6 + 3 * Math.sin(lt * 0.8)}deg) translateY(${(1 - k) * 120}px)`;
    c.style.opacity = k;
    const s = $('.stampc', r), sk = P(lt, 2.2, 0.35);
    s.style.opacity = sk; s.style.transform = `rotate(-14deg) scale(${2.2 - 1.2 * easeOut(sk)})`;
    r.querySelectorAll('.orb').forEach(o => {
      const i = +o.dataset.i, k2 = E(lt, 0.8 + i * 0.25, 0.6);
      o.style.opacity = k2;
      o.style.transform = `translateY(${Math.sin(lt * 1.3 + i * 1.7) * 14 + (1 - k2) * 40}px) scale(${0.6 + 0.4 * k2})`;
    });
  }};
};

B.agenda = sc => {
  const t = cueTimes(sc, sc.items.length);
  const r = el(`<div class="abs" style="left:150px;top:170px;width:1620px">
    <div class="h1" data-at="0.2">${sc.heading}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px 34px;margin-top:50px">
      ${sc.items.map((it, i) => `<div class="item" data-at="${t[i]}" data-fx="left"><div class="tick" style="background:rgba(139,92,246,.2);color:#c4b5fd">${i + 1}</div>${icon(it.icon, 54)}<span>${it.text}</span></div>`).join('')}
    </div></div>`);
  return { el: r, update: lt => reveal(r, lt) };
};

B.chapter = sc => {
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs wipe" style="left:0;top:0;height:1080px;background:linear-gradient(90deg,var(--teal),var(--violet))"></div>
    <div class="abs big" style="left:150px;top:230px;font-size:340px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.35)">${String(sc.num).padStart(2, '0')}</div>
    <div class="abs" style="left:160px;top:600px">
      <div class="pill" data-at="0.45" style="background:rgba(255,255,255,.08);color:var(--mut)">CHAPTER ${sc.num}</div>
      <div class="h1" data-at="0.6" style="font-size:88px;margin-top:22px">${sc.title}</div>
    </div>
    <div class="abs ic" style="right:160px;top:240px;width:480px;height:480px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(199,210,254,.28),transparent 68%)">${icon(sc.icon, 340)}</div>
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    const w = $('.wipe', r), a = E(lt, 0, 0.45), b = E(lt, 0.35, 0.45);
    w.style.left = (b * 1920) + 'px'; w.style.width = ((a - b) * 1920) + 'px';
    const g = $('.big', r); g.style.opacity = E(lt, 0.3, 0.6); g.style.transform = `translateX(${(1 - E(lt, 0.3, 0.8)) * -60}px)`;
    const ic = $('.ic', r), k = P(lt, 0.5, 0.7);
    ic.style.opacity = E(lt, 0.5, 0.4);
    ic.style.transform = `scale(${0.5 + 0.5 * easeBack(k)}) rotate(${(1 - easeOut(k)) * -20 + Math.sin(lt * 2) * 3}deg)`;
  }};
};

B.stat = sc => {
  const t = cueTimes(sc, sc.big.length);
  const r = el(`<div class="abs" style="left:150px;top:190px;width:1620px">
    <div class="row" data-at="0.2">${icon(sc.icon, 80)}<div class="h1">${sc.heading}</div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:80px">
      ${sc.big.map((b, i) => `<div class="card" data-at="${t[i]}" data-fx="pop" style="padding:56px 40px;text-align:center;border-color:${COLORS[b.color]}55">
        <div class="num" style="font-size:${b.value.length > 6 ? 80 : 96}px;white-space:nowrap;color:${COLORS[b.color]}">${b.value}</div>
        <div style="font-size:30px;color:var(--mut);margin-top:12px">${b.label}</div></div>`).join('')}
    </div></div>`);
  return { el: r, update: lt => reveal(r, lt) };
};

B.mad = sc => {
  const t = cueTimes(sc, sc.points.length);
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs h1" data-at="0.2" style="left:150px;top:160px">${sc.heading}</div>
    <div class="abs card" data-at="0.5" data-fx="left" style="left:150px;top:300px;width:620px;padding:44px;background:#f8fafc;color:#0f172a">
      <div style="display:flex;justify-content:space-between;font-size:24px;color:#64748b;font-weight:600"><span>CARD STATEMENT</span><span>Due: 15th</span></div>
      <div style="margin-top:36px;font-size:26px;color:#475569">Total Amount Due</div>
      <div class="num" style="font-size:84px">${sc.tad}</div>
      <div class="madbox" style="margin-top:26px;padding:22px 26px;border-radius:18px;background:#fef3c7;border:3px solid #f59e0b">
        <div style="font-size:26px;color:#92400e">Minimum Amount Due</div>
        <div class="num" style="font-size:60px;color:#b45309">${sc.mad}</div>
      </div>
    </div>
    <div class="abs" style="left:860px;top:310px;width:920px;display:flex;flex-direction:column;gap:22px">
      ${sc.points.map((p, i) => `<div class="item" data-at="${t[i]}" data-fx="right"><div class="tick" style="background:${i ? 'rgba(244,63,94,.18)' : 'rgba(34,197,94,.18)'};color:${i ? 'var(--red)' : 'var(--green)'}">${i ? '!' : '✓'}</div><span style="font-size:30px">${p}</span></div>`).join('')}
    </div></div>`);
  return { el: r, update(lt) { reveal(r, lt); const m = $('.madbox', r); m.style.transform = `scale(${1 + 0.04 * Math.max(0, Math.sin(lt * 4)) * E(lt, 1.2, 0.5)})`; } };
};

B.growth = sc => {
  const max = Math.max(...sc.bars.map(b => b[1]));
  const s0 = sc.sentences[0], s1 = sc.sentences[1];
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs row" data-at="0.2" style="left:150px;top:160px">${icon('chart-increasing', 76)}<div class="h1">${sc.heading}</div></div>
    <div class="abs" style="left:190px;top:330px;width:1180px;height:520px;display:flex;align-items:flex-end;gap:50px;border-bottom:2px solid rgba(255,255,255,.2)">
      ${sc.bars.map((b, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
        <div class="lbl num" style="font-size:34px;margin-bottom:12px"></div>
        <div class="b" data-v="${b[1]}" style="width:100%;border-radius:16px 16px 0 0;background:linear-gradient(180deg,${i === sc.bars.length - 1 ? '#f43f5e,#be123c' : '#f59e0b,#b45309'})"></div>
      </div>`).join('')}
    </div>
    <div class="abs" style="left:190px;top:864px;width:1180px;display:flex;gap:50px">${sc.bars.map(b => `<div style="flex:1;text-align:center;font-size:26px;color:var(--mut)">${b[0]}</div>`).join('')}</div>
    <div class="abs x2" style="left:1420px;top:400px;width:380px;text-align:center"><div class="num" style="font-size:130px;color:var(--red);line-height:1">${sc.mult || "~1.9×"}</div><div style="font-size:30px;color:var(--mut)">in one year</div></div>
    <div class="abs" data-at="1" style="left:190px;top:920px;font-size:20px;color:var(--mut);opacity:.8">${sc.note}</div>
  </div>`);
  const a = s0.start + 1, b = s1.end - 0.5;
  return { el: r, update(lt) {
    reveal(r, lt);
    r.querySelectorAll('.b').forEach((e, i) => {
      const k = E(lt, a + (b - a) * i / sc.bars.length, 1.1), v = +e.dataset.v;
      e.style.height = (k * v / max * 440) + 'px';
      e.parentElement.querySelector('.lbl').textContent = k > 0.02 ? inr(v * k) : '';
    });
    const x = $('.x2', r), k = P(lt, b + 0.4, 0.5); x.style.opacity = k; x.style.transform = `scale(${0.5 + 0.5 * easeBack(k)})`;
  }};
};

B.bullets = sc => {
  const t = cueTimes(sc, sc.items.length), col = COLORS[sc.tone] || COLORS.teal;
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs bigic" style="left:150px;top:330px;width:420px;height:420px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,${col}33,transparent 70%)">${icon(sc.icon, 260)}</div>
    <div class="abs" style="left:640px;top:150px;width:1140px">
      <div class="h1" data-at="0.2">${sc.heading}</div>
      <div style="display:flex;flex-direction:column;gap:${sc.items.length > 4 ? 14 : 20}px;margin-top:40px">
        ${sc.items.map((it, i) => `<div class="item" data-at="${t[i]}" data-fx="right" style="border-left:6px solid ${col};${sc.items.length > 4 ? 'font-size:29px;padding:15px 24px' : ''}">${icon(it.icon, 54)}<span>${it.text}</span></div>`).join('')}
      </div></div></div>`);
  return { el: r, update(lt) { reveal(r, lt); const b = $('.bigic', r), k = E(lt, 0.1, 0.8); b.style.opacity = k; b.style.transform = `scale(${0.7 + 0.3 * k}) translateY(${Math.sin(lt * 1.5) * 10}px)`; } };
};

const STAGES = ['Day 0–3', 'Day 4–30', 'Day 31–60', 'Day 61–90', 'Day 90+', 'Day 180+', '1 year+'];
B.timeline = sc => {
  const col = COLORS[sc.color], t = cueTimes(sc, sc.items.length);
  const x = i => 190 + i * (1540 / 6);
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs" style="left:190px;top:196px;width:1540px;height:8px;border-radius:4px;background:rgba(255,255,255,.12)"></div>
    <div class="abs fill" style="left:190px;top:196px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))"></div>
    ${STAGES.map((s, i) => `<div class="abs" style="left:${x(i) - 22}px;top:178px;width:44px;height:44px;border-radius:50%;background:${i <= sc.stage ? (i === sc.stage ? col : '#475569') : '#1e2745'};border:4px solid ${i === sc.stage ? '#fff' : 'rgba(255,255,255,.2)'}" ${i === sc.stage ? 'id="cur"' : ''}></div>
      <div class="abs" style="left:${x(i) - 110}px;top:236px;width:220px;text-align:center;font-size:22px;font-weight:${i === sc.stage ? 700 : 500};color:${i === sc.stage ? '#fff' : 'var(--mut)'}">${s}</div>`).join('')}
    <div class="abs card" data-at="0.25" style="left:190px;top:330px;width:1540px;height:570px;padding:50px 60px;border-color:${col}66">
      <div class="row">
        <div style="width:150px;height:150px;border-radius:36px;display:grid;place-items:center;background:${col}22" class="ic">${icon(sc.icon, 110)}</div>
        <div>
          <div class="pill" style="background:${col}26;color:${col}">${sc.days.toUpperCase()}</div>

const bars = (col) => `<div class="eq" style="display:flex;gap:6px;height:40px;align-items:flex-end;justify-content:center;margin-top:14px">${[0,1,2,3,4].map(() => `<div style="width:10px;border-radius:5px;background:${col}"></div>`).join('')}</div>`;
function animBars(el, on, lt, seed) {
  el.querySelectorAll('.eq div').forEach((b, i) => { const h = on ? 10 + 30 * Math.abs(Math.sin(lt * (6 + i) + seed + i * 1.7)) : 6; b.style.height = h + 'px'; b.style.opacity = on ? 1 : .35; });
}
const LABELS = {te: ['మీ ప్రశ్న', 'సమాధానం'], hi: ['आपका सवाल', 'जवाब']};

B.dialogue = sc => {
  const L = LABELS[TL.lang] || ['Question', 'Answer'];
  const av = (side, ic, col, label) => `<div class="abs av ${side}" style="${side === 'q' ? 'left:230px' : 'right:230px'};top:330px;width:420px;text-align:center">
      <div class="ring" style="width:300px;height:300px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,${col}33,transparent 70%);border:5px solid ${col}">${icon(ic, 200)}</div>
      <div class="pill" style="margin-top:22px;background:${col}26;color:${col};font-size:28px">${label}</div>${bars(col)}</div>`;
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs card" data-at="0.15" style="left:50%;margin-left:-560px;width:1120px;top:140px;padding:28px 40px;display:flex;gap:24px;align-items:center;border-color:rgba(245,158,11,.5)">
      ${icon(sc.icon, 72)}<div style="font-size:40px;font-weight:700;line-height:1.25">${sc.topic}</div></div>
    ${av('q', 'worried-face', '#f59e0b', L[0])}${av('a', 'man-office-worker', '#2dd4bf', L[1])}
    <div class="abs vs" style="left:50%;top:430px;transform:translateX(-50%);font-size:40px;color:var(--mut);font-weight:800">⟷</div>
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    const who = speakerAt(sc, lt);
    [['q', 0], ['a', 2]].forEach(([w, seed]) => {
      const a = $('.av.' + w, r), on = who === w, k = E(lt, w === 'q' ? 0.2 : 0.5, 0.6);
      a.style.opacity = k * (on || !who ? 1 : 0.55);
      a.style.transform = `translateY(${(1 - k) * 60}px) scale(${on ? 1.06 : 0.96})`;
      $('.ring', a).style.boxShadow = on ? `0 0 ${40 + 20 * Math.sin(lt * 5)}px ${w === 'q' ? '#f59e0b' : '#2dd4bf'}` : 'none';
      animBars(a, on, lt, seed);
    });
  }};
};

B.secured = sc => {
  const t = cueTimes(sc, 3), vAt = sentStart(sc, sc.verdictCue);
  const col = (d, colr, at0, times, vAt) => `<div class="card" data-at="${at0}" style="padding:36px 40px;border-color:${colr}88">
      <div class="h2" style="color:${colr}">${d.title}</div><div style="font-size:26px;color:var(--mut);margin-top:6px">${d.sub}</div>
      ${d.items.map((it, i) => `<div class="row" data-at="${times[i]}" style="margin-top:22px;gap:18px;font-size:32px">${icon(it[0], 64)}<span style="flex:1">${it[1]}</span>${it[2] !== '—' ? `<span class="pill" style="background:${colr}22;color:${colr};font-size:22px">${it[2]}</span>` : ''}</div>`).join('')}
      <div class="verdict" data-at="${vAt}" data-fx="pop" style="margin-top:30px;padding:18px 22px;border-radius:18px;background:${colr}1f;border:2px solid ${colr};font-size:28px;font-weight:700">${d.verdict}</div>
    </div>`;
  const r = el(`<div class="abs" style="left:150px;top:150px;width:1620px;display:grid;grid-template-columns:1fr 1fr;gap:44px">
    ${col(sc.secured, '#f59e0b', 0.3, [t[0], t[0] + .4, t[0] + .8], sentStart(sc, 2))}
    ${col(sc.unsecured, '#2dd4bf', t[2] - 0.2, [t[2], t[2] + .4, t[2] + .8], vAt)}</div>`);
  return { el: r, update: lt => reveal(r, lt) };
};

B.stack = sc => {
  const t = cueTimes(sc, sc.parts.length), tagAt = sentStart(sc, sc.tagCue), W = 1560;
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs h1" data-at="0.2" style="left:180px;top:150px;font-size:56px">${sc.heading}</div>
    <div class="abs" style="left:180px;top:330px;width:${W}px;height:120px;border-radius:24px;background:rgba(255,255,255,.06);overflow:hidden;display:flex">
      ${sc.parts.map((p, i) => `<div class="seg" data-i="${i}" style="height:100%;width:0;background:${COLORS[p[2]]};border-right:3px solid #0b1020"></div>`).join('')}
    </div>
    <div class="abs tot num" style="left:180px;top:250px;width:${W}px;text-align:right;font-size:44px;color:var(--red)">Total shown: ${inr(sc.total)}</div>
    <div class="abs" style="left:180px;top:500px;width:${W}px;display:grid;grid-template-columns:repeat(${sc.parts.length},1fr);gap:22px">
      ${sc.parts.map((p, i) => `<div data-at="${t[i]}" style="border-top:6px solid ${COLORS[p[2]]};padding-top:16px"><div class="num" style="font-size:44px;color:${COLORS[p[2]]}">${inr(p[1])}</div><div style="font-size:25px;color:var(--mut);margin-top:6px">${p[0]}</div></div>`).join('')}
    </div>
    <div class="abs pill" data-at="${tagAt}" data-fx="pop" style="left:180px;top:760px;background:rgba(45,212,191,.18);color:var(--teal);font-size:34px;padding:16px 34px">${icon('handshake', 44)} ${sc.tag}</div>
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    r.querySelectorAll('.seg').forEach((e, i) => e.style.width = (E(lt, t[i], 0.9) * sc.parts[i][1] / sc.total * W) + 'px');
    $('.tot', r).style.opacity = E(lt, t[t.length - 1] + 0.8, 0.5);
  }};
};

B.table = sc => {
  const t = cueTimes(sc, sc.rows.length), n = sc.cols.length;
  const tpl = n === 2 ? '1fr 2fr' : '1.1fr 1fr 1.4fr 0.9fr';
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs h1" data-at="0.2" style="left:150px;top:140px;font-size:52px;width:1620px">${sc.heading}</div>
    <div class="abs" style="left:150px;top:250px;width:1620px">
      <div style="display:grid;grid-template-columns:${tpl};gap:0;padding:18px 28px;border-radius:18px 18px 0 0;background:rgba(139,92,246,.22);font-size:26px;font-weight:700;color:#ddd6fe">${sc.cols.map(c => `<div>${c}</div>`).join('')}</div>
      ${sc.rows.map((row, i) => `<div class="tr" data-at="${t[i]}" data-fx="left" style="display:grid;grid-template-columns:${tpl};padding:22px 28px;border-bottom:1px solid rgba(255,255,255,.08);background:var(--card);font-size:${n === 2 ? 32 : 30}px;align-items:center">
        ${row.map((c, j) => `<div style="${j === 0 ? 'font-weight:700' : ''};${j === n - 1 && n > 2 ? `color:${['var(--green)', 'var(--green)', 'var(--amber)', 'var(--red)'][i]}` : ''};${j === 2 && n > 2 ? 'color:var(--teal);font-weight:700' : ''}">${c}</div>`).join('')}</div>`).join('')}
      <div data-at="1" style="margin-top:16px;font-size:21px;color:var(--mut)">${sc.note}</div>
    </div>
    ${sc.tag ? `<div class="abs pill" data-at="${sentStart(sc, sc.tagCue)}" data-fx="pop" style="left:150px;top:${n === 2 ? 790 : 810}px;background:rgba(45,212,191,.18);color:var(--teal);font-size:32px;padding:16px 32px">${icon('bullseye', 40)} ${sc.tag}</div>` : ''}
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    let cur = -1; t.forEach((x, i) => { if (lt >= x) cur = i; });
    r.querySelectorAll('.tr').forEach((e, i) => { e.style.background = i === cur ? 'rgba(45,212,191,.14)' : 'var(--card)'; });
  }};
};

B.property = sc => {
  const t = cueTimes(sc, sc.cards.length);
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs h1" data-at="0.2" style="left:150px;top:140px;font-size:54px">${sc.heading}</div>
    <div class="abs" style="left:150px;top:250px;width:1620px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px">
      ${sc.cards.map((c, i) => `<div class="card" data-at="${t[i]}" data-fx="pop" style="padding:28px 30px;min-height:260px;border-color:${COLORS[c[3]]}77">
        <div class="row" style="gap:16px">${icon(c[0], 64)}<div style="font-size:28px;font-weight:700;line-height:1.25">${c[1]}</div></div>
        <div class="pill" style="margin-top:20px;background:${COLORS[c[3]]}26;color:${COLORS[c[3]]};font-size:22px">${c[2]}</div>
        <div style="font-size:23px;color:var(--mut);margin-top:14px;line-height:1.4">${c[4]}</div></div>`).join('')}
    </div></div>`);
  return { el: r, update: lt => reveal(r, lt) };
};

B.faq = sc => {
  const S = sc.sentences, n = sc.pairs.length;
  const qAt = i => S[1 + 2 * i] ? S[1 + 2 * i].start : 1e9, aAt = i => S[2 + 2 * i] ? S[2 + 2 * i].start : 1e9;
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs row" data-at="0.2" style="left:150px;top:140px">${icon('thinking-face', 76)}<div class="h1">Quick answers</div></div>
    <div class="abs cnt num" style="right:150px;top:160px;font-size:44px;color:var(--mut)"></div>
    ${sc.pairs.map((p, i) => `<div class="abs pr" data-i="${i}" style="left:150px;top:290px;width:1620px">
      <div class="card" style="padding:34px 44px;border-color:rgba(245,158,11,.6);background:rgba(245,158,11,.08);display:flex;gap:26px;align-items:center">${icon('worried-face', 84)}<div style="font-size:54px;font-weight:700">${p[0]}</div></div>
      <div class="card ans" style="margin-top:28px;padding:34px 44px;border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.08);display:flex;gap:26px;align-items:center">${icon('man-office-worker', 84)}<div style="font-size:40px;font-weight:600;line-height:1.35">${p[1]}</div></div>
    </div>`).join('')}
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    let cur = -1;
    r.querySelectorAll('.pr').forEach((e, i) => {
      const a = qAt(i), b = i + 1 < n ? qAt(i + 1) : 1e9;
      if (lt >= a) cur = i;
      const vin = E(lt, a, 0.45), vout = E(lt, b - 0.3, 0.3);
      e.style.opacity = vin * (1 - vout); e.style.transform = `translateY(${(1 - vin) * 40 - vout * 40}px)`;
      const an = $('.ans', e), k = E(lt, aAt(i), 0.45); an.style.opacity = k; an.style.transform = `translateX(${(1 - k) * 60}px)`;
    });
    $('.cnt', r).textContent = cur >= 0 ? `${cur + 1} / ${n}` : '';
  }};
};

const helpStrip = (text, at) => `<div class="abs" data-at="${at}" data-fx="pop" style="left:50%;margin-left:-620px;width:1240px;top:790px;padding:20px 34px;border-radius:24px;display:flex;align-items:center;gap:22px;background:linear-gradient(90deg,rgba(45,212,191,.2),rgba(139,92,246,.2));border:2px solid rgba(45,212,191,.55)">
  ${icon('telephone', 58)}<div style="font-size:33px;font-weight:600">${text}</div></div>`;

B.why = sc => {
  const t = cueTimes(sc, sc.chain.length);
  const hopeAt = sentStart(sc, sc.hopeCue), helpAt = sentStart(sc, sc.helpCue);
  const cols = ['#f59e0b', '#fb923c', '#f43f5e', '#e11d48', '#9f1239'];
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs h1" data-at="0.2" style="left:150px;top:150px">${sc.heading}</div>
    <div class="abs chain" style="left:150px;top:290px;width:1620px;display:flex;align-items:center;justify-content:space-between">
      ${sc.chain.map((c, i) => `<div data-at="${t[i]}" data-fx="pop" style="width:250px;text-align:center">
          <div style="width:170px;height:170px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:${cols[i]}22;border:3px solid ${cols[i]}">${icon(c.icon, 100)}</div>
          <div style="font-size:28px;font-weight:600;margin-top:16px">${c.text}</div></div>
        ${i < sc.chain.length - 1 ? `<div data-at="${t[i] + 0.3}" style="font-size:54px;color:${cols[i]};font-weight:800;margin-top:-50px">→</div>` : ''}`).join('')}
    </div>
    <div class="abs hope" style="left:50%;margin-left:-620px;width:1240px;top:600px;padding:26px 36px;border-radius:24px;display:flex;align-items:center;gap:24px;background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.6)">
      ${icon('seedling', 70)}<div style="font-size:36px;font-weight:700">${sc.hope}</div></div>
    ${helpStrip(sc.help, helpAt)}
  </div>`);
  return { el: r, update(lt) {
    reveal(r, lt);
    const h = $('.hope', r), k = E(lt, hopeAt, 0.6);
    h.style.opacity = k; h.style.transform = `translateY(${(1 - k) * 40}px)`;
    // the chain dims once the message turns to hope
    $('.chain', r).style.opacity = 1 - 0.55 * E(lt, hopeAt, 0.8);
  }};
};

B.disclaimer = sc => {
  const t = cueTimes(sc, sc.items.length), helpAt = sentStart(sc, sc.helpCue);
  const r = el(`<div class="abs" style="inset:0">
    <div class="abs row" data-at="0.2" style="left:150px;top:140px">${icon('balance-scale', 80)}<div class="h1">${sc.heading}</div></div>
    <div class="abs" style="left:150px;top:260px;width:1620px;display:grid;grid-template-columns:1fr 1fr;gap:16px 30px">
      ${sc.items.map((it, i) => `<div class="item" data-at="${t[i]}" style="font-size:27px;padding:16px 24px;align-items:flex-start"><div class="tick" style="width:38px;height:38px;font-size:22px;background:rgba(245,158,11,.2);color:var(--amber)">!</div><span>${it}</span></div>`).join('')}
    </div>
    ${helpStrip(sc.help, helpAt)}
  </div>`);
  return { el: r, update: lt => reveal(r, lt) };
};

// ---- captions -------------------------------------------------------------
// split long sentences into readable chunks, timed by character share
function chunks(s) {
  const parts = s.text.split(/(?<=[,—–।?!:;])\s+|(?<=\.)\s+/).filter(Boolean);
  const out = []; let cur = '';
  for (const p of parts) { if ((cur + ' ' + p).trim().length > 68 && cur) { out.push(cur.trim()); cur = p; } else cur = (cur + ' ' + p).trim(); }
  if (cur) out.push(cur);
  const total = out.reduce((a, c) => a + c.length, 0); let t0 = s.start;
  return out.map(c => { const d = (s.end - s.start) * c.length / total; const r = {text: c.replace(/\s*[—–]$/, ''), who: s.who, start: t0, end: t0 + d}; t0 += d; return r; });
}

// ---- background -----------------------------------------------------------
// The backdrop (gradient, colour glows, grid) is painted once onto a canvas
// larger than the frame and then drifted with a cheap GPU transform —
// repainting blurred layers every frame was the render bottleneck.
let BGSRC;
function initBg() {
  const W = 2400, H = 1500, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const lin = g.createLinearGradient(0, 0, W, H); lin.addColorStop(0, '#0d1430'); lin.addColorStop(1, '#070b1a');
  g.fillStyle = lin; g.fillRect(0, 0, W, H);
  const glow = (x, y, r, c, a) => { const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, c + a); rg.addColorStop(1, c + '00'); g.fillStyle = rg; g.fillRect(0, 0, W, H); };
  glow(600, 350, 900, '#1e2a78', 'cc'); glow(1950, 1250, 850, '#3b1a6e', 'cc');
  glow(1700, 400, 600, '#2dd4bf', '40'); glow(500, 1150, 650, '#8b5cf6', '48'); glow(1250, 800, 500, '#38bdf8', '30');
  g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 80) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  for (let y = 0; y < H; y += 80) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  const vig = g.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1400); vig.addColorStop(0, 'rgba(7,11,26,0)'); vig.addColorStop(1, 'rgba(7,11,26,0.85)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  BGSRC = cv;
  const view = document.createElement('canvas'); view.width = 1920; view.height = 1080;
  view.id = 'bgc'; view.style.cssText = 'position:absolute;left:0;top:0';
  $('#bg').replaceWith(view); $('#grid').remove();
  const fx = $('#fx');
  for (let i = 0; i < 40; i++) fx.appendChild(el(`<div class="dot"></div>`));
}
function drawBg(t) {
  $('#bgc').getContext('2d').drawImage(BGSRC, -(-240 + Math.sin(t * 0.05) * 200), -(-210 + Math.cos(t * 0.037) * 180), 1920, 1080, 0, 0, 1920, 1080);
  $('#fx').querySelectorAll('.dot').forEach((d, i) => {
    const sx = (i * 397) % 1920, sp = 8 + (i % 7) * 4;
    d.style.transform = `translate(${sx + Math.sin(t * 0.3 + i) * 30}px,${1100 - ((t * sp + i * 137) % 1160)}px)`;
    d.style.opacity = 0.08 + 0.18 * ((i * 31) % 10) / 10;
  });
}

// ---- main -----------------------------------------------------------------
let curId = null, curObj = null;
window.setup = (timeline, icons) => {
  TL = timeline; ICONS = icons;
  document.body.className = TL.lang;
  $('#lang').textContent = TL.lang === 'hi' ? 'HINGLISH' : 'TELUGU';
  $('#hud .logo').innerHTML = icon('credit-card', 30);
  TL.scenes.forEach(s => { s.caps = s.sentences.flatMap(chunks); });
  let ch = '';
  TL.scenes.forEach(s => { if (s.type === 'chapter') ch = s.title; s.chapterName = s.type === 'disclaimer' ? 'Disclaimer' : ch; });
  initBg();
  return document.fonts.ready.then(() => TL.total);
};

window.render = t => {
  drawBg(t);
  const sc = TL.scenes.find(s => t >= s.start && t < s.start + s.dur) || TL.scenes[TL.scenes.length - 1];
  const lt = t - sc.start;
  if (sc.id !== curId) {
    const root = $('#scene'); root.innerHTML = '';
    curObj = B[sc.type](sc); root.appendChild(curObj.el); curId = sc.id;
  }
  curObj.update(lt);
  const fin = E(lt, 0, 0.45), fout = sc.type === 'chapter' ? 1 : 1 - E(lt, sc.dur - 0.35, 0.35);
  const sEl = $('#scene');
  sEl.style.opacity = Math.min(fin, fout);
  sEl.style.transform = `scale(${0.97 + 0.03 * fin})`;
  $('#hud .ch').textContent = sc.chapterName || 'Introduction';
  $('#hud').style.opacity = sc.type === 'title' ? E(lt, 3, 0.6) : 1;
  const c = sc.caps.find(c => lt >= c.start - 0.05 && lt < c.end + 0.3);
  const cap = $('#cap');
  if (c) { if (cap.dataset.k !== c.text) { cap.innerHTML = c.who === 'q' ? `<span style="border-left:6px solid var(--amber);color:#fde68a">${c.text}</span>` : `<span>${c.text}</span>`; cap.dataset.k = c.text; } cap.style.opacity = 1; }
  else { cap.style.opacity = 0; }
  $('#bar').style.width = (t / TL.total * 1920) + 'px';
};
</script>
